[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
version = "1.3.2"
name = "language-tags"
dynamic = ["readme"]
authors = [
    { name = "Flanders Heritage Agency", email = "ict@onroerenderfgoed.be" },
]
license = "MIT"
description = "This project is a Python version of the language-tags Javascript project."
requires-python = ">=3.10,<3.16"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Framework :: Pyramid",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
]

[project.urls]
History = "https://github.com/OnroerendErfgoed/language-tags/blob/master/HISTORY.rst"
Tracker = "https://github.com/OnroerendErfgoed/language-tags/issues"
Source = "https://github.com/OnroerendErfgoed/language-tags"
Documentation = "https://language-tags.readthedocs.io/en/latest/"

[project.optional-dependencies]
dev = [
    "uv==0.13.5",
    "sphinx==8.1.3",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

##
# Build tool specific
##
[tool.hatch.build.targets.wheel]
# In the wheel we want to have language-tags in the root as python module.
only-include = [
    "/language_tags",
]

[tool.hatch.metadata]
# This allows us to use github links as dependencies
allow-direct-references = true

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/x-rst"
fragments = [
  { path = "README.rst" },
  { path = "HISTORY.rst" },
]

[tool.coverage.run]
# Measure the package wherever it is imported from, so coverage also works
# when the tests run against the installed wheel instead of the source tree.
source_pkgs = ["language_tags"]

[tool.coverage.paths]
source = [
    "language_tags/",
    "*/site-packages/language_tags/",
]
