name: language-tags backend tests

on:
  pull_request:
    paths:
      - language_tags/**
      - tests/**
      - .github/workflows/language-tags.yaml
      - pyproject.toml
      - requirements*.txt

  push:
    branches:
      - master

permissions: {}

jobs:
  test:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-tests.yml@v1
    permissions:
      contents: read
      pull-requests: write # coverage comment
    with:
      runs-on: ubuntu-latest # public repo: no self-hosted runners
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]'
      allow-prereleases: true # 3.15
      # Tests run against the installed wheel, not an editable install
      install-command: |
        pip install pip-tools
        pip-sync requirements-dev.txt
        pip wheel --no-deps --wheel-dir dist .
        pip install --no-deps --only-binary :all: dist/*.whl
      lint-command: "" # the old workflow ran no linter
      test-command: pytest tests --exitfirst --capture=no -vvv --full-trace --cov --cov-report=xml:"$COVERAGE_XML"
